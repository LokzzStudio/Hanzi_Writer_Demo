<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hanzi Writer — Handwriting Demo</title>

<style>
  /* A rounded face for the Latin text. Delete this line and the page falls
     back to the system stack below with nothing else to change. */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap');

  /* The desk stays dark in both themes — the panel is a toolbox, and a toolbox
     should recede so the sheet is the lit thing. Ground tokens and surface
     tokens are kept apart because they answer to different backdrops. */
  :root {
    color-scheme: dark;

    /* the ground, and what sits directly on it */
    --bg: #020617;
    --text: #e2e8f0;
    --label: #475569;
    --label-zh: #94a3b8;
    --rule: #1e293b;

    /* button surfaces */
    --surface: #0f172a;
    --surface-quiet: transparent;
    --surface-border: #1e293b;
    --surface-border-soft: #334155;
    --surface-border-hover: #64748b;
    --on-surface: #94a3b8;
    --on-surface-quiet: #64748b;
    --on-surface-hover: #ffffff;

    /* the sheet, and the ink written on it */
    --ink: #fcd34d;
    --ink-rgb: 252, 211, 77;
    --ink-outline: #5a3a20;
    --accent-bright: #fef3c7;
    --paper: #242424;
    --band: #0e0d0c;
    --frame: #7a5433;
    --grid-line: rgba(90, 58, 32, 0.85);
    --paper-shadow: 0 0 30px rgba(var(--ink-rgb), 0.08);

    --scrim: rgba(2, 6, 23, 0.92);
    --error: #fda4af;
    --error-strong: #ffffff;
  }

  /* A chosen thing is marked in the ink of the sheet — so this is written once,
     against --ink, and each theme only has to say what its ink is. */
  :root {
    --accent: rgb(var(--ink-rgb));
    --accent-bg: rgba(var(--ink-rgb), 0.15);
    --accent-bg-hover: rgba(var(--ink-rgb), 0.26);
    --accent-bg-strong: rgba(var(--ink-rgb), 0.2);
    --accent-border: rgba(var(--ink-rgb), 0.42);
    --accent-border-strong: rgba(var(--ink-rgb), 0.62);
    --option-bg: rgba(var(--ink-rgb), 0.14);
    --option-border: rgba(var(--ink-rgb), 0.5);
  }

  /* Ivory paper, taupe ink — and the buttons follow, because everything above
     is written against --ink. */
  [data-theme="light"] {
    /* What is written is dark, the way ink is; --ink-rgb is that same ink
       lifted to where it can still be seen against the dark panel. */
    --ink: #8a7d5a;
    --ink-rgb: 196, 184, 156;
    --ink-outline: #ded5bf;
    --paper: #faf7ec;
    --band: #1c1a17;
    --frame: #cec6b6;
    --grid-line: rgba(201, 180, 160, 0.95);
    --accent-bright: #e8dfc9;

    --scrim: rgba(252, 250, 241, 0.94);
    --error: #a33b4c;
    --error-strong: #454036;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Baloo 2", ui-rounded, "Segoe UI Variable Display",
                 ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* Equal flexible columns either side of the sheet, so the sheet sits in the
     middle of the screen and the panels hang off its right rather than
     shifting it left. */
  .layout {
    min-height: calc(100vh - 48px);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 36px 104px;
  }

  .stage {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .panels {
    grid-column: 3;
    justify-self: start;
    width: 372px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  @media (max-width: 1320px) {
    .layout {
      grid-template-columns: 1fr;
      justify-items: center;
      /* Stacked, the two rows would otherwise stretch to fill the viewport and
         open a gap between the sheet and the panels. */
      align-content: center;
    }
    .stage, .panels { grid-column: 1; }
    .panels {
      justify-self: center;
      width: 100%;
      max-width: 420px;
    }
    .row { justify-content: center; }
    .group-label::before {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
  }

  /* ── Canvas ─────────────────────────────────────────────── */

  /* Two things, as on the reference sheet: a thick dark band around the paper,
     and one irregular line ruled around that. */
  .paper {
    position: relative;
    width: 330px;
    height: 330px;
    display: grid;
    place-items: center;
  }

  /* The line's path is generated, not authored — see handDrawnLoop below. */
  .frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    fill: none;
    stroke: var(--frame);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Barely a band — the dark edge the paper sits on, not a border. */
  .band {
    padding: 5px;
    background: var(--band);
    border-radius: 21px 17px 23px 16px;
    box-shadow: var(--paper-shadow);
    transition: background-color 0.2s ease;
  }

  /* The guide lines live on their own layer beneath the writer, which repaints
     its canvas every frame and would otherwise wipe them. */
  .sheet {
    position: relative;
    width: 280px;
    height: 280px;
    border-radius: 18px 14px 20px 13px;
    background: var(--paper);
    transition: background-color 0.2s ease;
  }

  .sheet canvas {
    position: absolute;
    inset: 0;
    display: block;
    border-radius: inherit;
  }

  #grid { pointer-events: none; }
  #canvas { z-index: 1; touch-action: none; }

  .load-error {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    border-radius: inherit;
    background: var(--scrim);
    color: var(--error);
    font-size: 14px;
    text-align: center;
  }
  .load-error.shown { display: flex; }
  .load-error b { color: var(--error-strong); font-size: 18px; }

  /* ── Stroke start hint ───────────────────────────────────── */

  .stroke-hint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  #hint-group .hint-ripple {
    fill: var(--ink);
    transform-box: fill-box;
    transform-origin: center;
    animation: hint-ripple 2.1s cubic-bezier(0.15, 0, 0.3, 1) infinite;
  }
  #hint-group .hint-ripple:nth-child(2) { animation-delay: 0.7s; }
  #hint-group .hint-ripple:nth-child(3) { animation-delay: 1.4s; }

  @keyframes hint-ripple {
    0%   { transform: scale(1);   opacity: 0.3; }
    80%  { opacity: 0; }
    100% { transform: scale(3.2); opacity: 0; }
  }

  #hint-group .hint-glow  { fill: var(--ink); opacity: 0.18; }
  #hint-group .hint-inner { fill: var(--ink); opacity: 0.28; }
  #hint-group .hint-dot   { fill: var(--ink); opacity: 0.75; }

  #hint-group .hint-arrow line {
    stroke: var(--ink);
    opacity: 0.85;
    stroke-width: 2.8;
    stroke-linecap: round;
  }
  #hint-group .hint-arrow polygon {
    fill: var(--ink);
    opacity: 0.85;
  }

  /* ── Buttons ────────────────────────────────────────────── */

  /* Big, round and springy — the whole page is aimed at small hands. */
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 16px;
    transition: transform 0.12s ease, background-color 0.15s ease,
                border-color 0.15s ease, color 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(1px) scale(0.97); }

  /* The disc is drawn, not shaped by CSS — but it stays nearly true, and the
     hand shows in the glyph on it rather than in its edge. */
  .controls {
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .icon-btn {
    width: 86px;
    height: 86px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: #dbe3ee;
    filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.55));
  }
  .icon-btn svg { display: block; width: 100%; height: 100%; }

  .disc { stroke-linejoin: round; }
  .disc.inked {
    fill: url(#fill-ink);
    stroke: #fff6e2;
    stroke-width: 3.3;
  }
  .gloss { pointer-events: none; fill: url(#gloss); }

  .icon-btn:hover .disc.inked { stroke: #ffffff; }

  /* Ink is a pale colour, so what is drawn on it has to be the dark one. */
  .icon-btn.primary { color: var(--band); }

  /* ── Selections ─────────────────────────────────────────── */

  /* The rows pick different kinds of thing — one changes what you write, the
     others only how the page looks — so each is captioned and ruled off. */
  .group {
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .group-label {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 0 0 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--label);
  }
  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .group-label .zh {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--label-zh);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
  }

  .glyph {
    width: 54px;
    height: 54px;
    font-size: 27px;
    font-weight: 700;
    color: var(--on-surface);
    background: var(--surface);
    border: 2px solid var(--surface-border);
  }
  .glyph:hover { color: var(--on-surface-hover); border-color: var(--surface-border-soft); }
  .glyph[aria-pressed="true"] {
    color: var(--accent);
    background: var(--accent-bg-strong);
    border-color: var(--accent-border-strong);
  }

  /* Settings carry a picture of what they do, so they read as options rather
     than as more characters to write. */
  .options { gap: 6px; }

  .options .glyph {
    display: flex;
    align-items: center;
    gap: 8px;
    width: auto;
    height: 44px;
    padding: 0 15px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 14px;
    color: var(--on-surface-quiet);
    background: var(--surface-quiet);
    border-color: var(--surface-border);
  }
  .options .glyph:hover { color: var(--on-surface-hover); }
  .options .glyph[aria-pressed="true"] {
    color: var(--on-surface-hover);
    background: var(--option-bg);
    border-color: var(--option-border);
  }

  .options svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .grids svg rect { opacity: 0.35; }
  .grids svg line { opacity: 0.85; }
</style>
</head>

<body>

<!-- Fills for the discs. Kept out of the buttons so both can share them, and
     written against --ink-rgb so they follow the theme. -->
<svg width="0" height="0" aria-hidden="true" style="position: absolute">
  <defs>
    <linearGradient id="fill-ink" x1="0.25" y1="0" x2="0.72" y2="1">
      <stop offset="0" style="stop-color: rgb(var(--ink-rgb))" />
      <stop offset="1" style="stop-color: rgba(var(--ink-rgb), 0.6)" />
    </linearGradient>
    <radialGradient id="gloss" cx="0.36" cy="0.24" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>

<div class="layout">

<div class="stage">

  <div class="paper">
    <svg class="frame" viewBox="0 0 330 330" aria-hidden="true">
      <path id="frame-path" />
    </svg>
    <div class="band">
      <div class="sheet">
        <canvas id="grid" width="280" height="280"></canvas>
        <canvas id="canvas" width="280" height="280"></canvas>
        <svg id="stroke-hint" class="stroke-hint" width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
          <g id="hint-group" display="none">
            <circle class="hint-ripple" r="10" />
            <circle class="hint-ripple" r="10" />
            <circle class="hint-ripple" r="10" />
            <circle class="hint-glow" r="14" />
            <circle class="hint-inner" r="8" />
            <circle class="hint-dot" r="3.5" />
            <g id="hint-arrow" class="hint-arrow">
              <line x1="7" y1="0" x2="24" y2="0" />
              <polygon points="21,-3 27,0 21,3" />
            </g>
          </g>
        </svg>
        <div class="load-error" id="load-error">
          <p>No stroke data for <b id="missing-char"></b>.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Each glyph is drawn fat and then fattened again with a matching stroke
       and round joins, which is what rounds every corner off. -->
  <!-- Writing starts on its own, so the only button left is the one that asks
       to be shown again. -->
  <div class="controls">
    <button class="icon-btn primary" id="animate" aria-label="Watch again"
            title="再看一次 · Watch the strokes again">
      <svg viewBox="0 0 88 88" aria-hidden="true">
        <path class="disc inked" data-disc="3141592" />
        <path class="gloss" />
        <g transform="translate(44 44) scale(1.62) translate(-12 -12)">
          <path class="glyph-shape" data-poly="9.6,7 18,12 9.6,17" data-seed="4242"
                fill="currentColor" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
        </g>
      </svg>
    </button>
  </div>

</div>

<aside class="panels">

  <section class="group">
    <h2 class="group-label"><span class="zh">選字</span> Character to write</h2>
    <div class="row" id="characters"></div>
  </section>

  <section class="group">
    <h2 class="group-label"><span class="zh">格線</span> Guide lines</h2>
    <div class="row options grids" id="grids"></div>
  </section>

  <section class="group">
    <h2 class="group-label"><span class="zh">主題</span> Theme</h2>
    <div class="row options themes" id="themes"></div>
  </section>

</aside>

</div>

<!-- Sound. Cloned on play so a clip can overlap its own tail. -->
<audio id="sfx-brush"        src="sound/magic_scroll_sfx_brush_stroke.wav"      preload="auto"></audio>
<audio id="sfx-correct"      src="sound/magic_scroll_sfx_correct_stroke.wav"    preload="auto"></audio>
<audio id="sfx-wrong"        src="sound/magic_scroll_sfx_wrong_stroke.wav"      preload="auto"></audio>
<audio id="sfx-correct-word" src="sound/magic_scroll_sfx_correct_word_abcd.wav" preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>

<script>
(function () {
  'use strict';

  var CHARACTERS = ['一', '人', '土', '木', '田', '老', '言', '雨', '風', '夏', '鳥'];
  /** 無 draws nothing, 田 the two centre lines, 米 those plus the diagonals. */
  var GRIDS = ['無', '田', '米'];
  var THEMES = ['light', 'dark'];

  var CANVAS_SIZE = 280;
  var LENIENCY = 2.5;
  /** Matches the writer's own delayBetweenStrokes, since the demonstration
   *  below is driven one stroke at a time rather than in one call. */
  var DELAY_BETWEEN_STROKES = 100;
  /** A beat between the demonstration ending and the canvas going live, so
   *  the last stroke is seen before the sheet clears. */
  var PAUSE_BEFORE_WRITING = 420;
  /** How far along the spine to look before trusting a direction. */
  var HINT_AIM_DISTANCE = 12;
  /** Keeps the guide lines clear of the rounded corners. */
  var GRID_INSET = 8;
  var THEME_KEY = 'hanzi-writer-demo-theme';

  var canvas = document.getElementById('canvas');
  var gridCanvas = document.getElementById('grid');
  var loadError = document.getElementById('load-error');
  var missingChar = document.getElementById('missing-char');
  var characterList = document.getElementById('characters');
  var gridList = document.getElementById('grids');
  var themeList = document.getElementById('themes');
  var hintGroup = document.getElementById('hint-group');
  var hintArrow = document.getElementById('hint-arrow');

  var char = CHARACTERS[0];
  var grid = '米';
  var theme = 'dark';
  var writer = null;
  var strokeCount = 0;
  var charData = null;
  /** Bumped whenever anything supersedes a running animation, so a stroke
   *  callback from the previous run cannot queue the next stroke. */
  var run = 0;
  /** The brush sound is the player's pen touching down, so it must not fire
   *  when the canvas is tapped outside a quiz. */
  var quizActive = false;

  /* ── Sound ──────────────────────────────────────────────── */

  /** Semitones above the tonic for do re mi fa so la ti. */
  var MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];

  /** Playback rate that lifts a clip to the nth degree of the scale. Degrees
   *  past ti roll into the next octave — do' re' mi' — so a long character
   *  keeps climbing instead of sitting on its top note. */
  function noteRate(step) {
    var octave = Math.floor(step / MAJOR_SCALE.length);
    var degree = step % MAJOR_SCALE.length;
    return Math.pow(2, (octave * 12 + MAJOR_SCALE[degree] - 6) / 12);
  }

  function play(id, rate) {
    var el = document.getElementById(id);
    if (!el) return;
    var clip = el.cloneNode();
    clip.volume = el.volume;
    if (rate && rate !== 1) {
      // Browsers preserve pitch across a rate change by default, which would
      // make the clip shorter without making it higher.
      clip.preservesPitch = false;
      clip.mozPreservesPitch = false;
      clip.webkitPreservesPitch = false;
      clip.playbackRate = rate;
    }
    var done = clip.play();
    if (done && done.catch) done.catch(function () { /* not unlocked yet */ });
  }

  /* ── The ruled frame ────────────────────────────────────── */

  /* A hand-ruled line is irregular in a way an authored bezier is not, so the
     path is generated: walk a rounded square, push every sample off the true
     line by a bit of smooth noise, then run a spline back through them.
     The noise is periodic in t, so the loop meets itself; past t = 1 the line
     drifts outward for a fraction of a turn, which is the overshoot a pen
     leaves when the hand carries on past where it started. */

  /** Deterministic, so the frame is the same line every visit. */
  function mulberry32(seed) {
    return function () {
      seed = (seed + 0x6d2b79f5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Sum of a few harmonics — smooth, and periodic over one turn. The middle
   *  frequencies carry the most weight: those are the bends a hand makes over
   *  the length of an edge, and they are what a single low wave cannot fake. */
  function periodicNoise(random) {
    var waves = [
      { f: 1, a: 0.55 }, { f: 2, a: 0.85 }, { f: 3, a: 0.75 },
      { f: 5, a: 0.5 },  { f: 8, a: 0.3 },  { f: 13, a: 0.16 }
    ].map(function (w) { w.p = random() * Math.PI * 2; return w; });
    var total = waves.reduce(function (sum, w) { return sum + w.a; }, 0);
    return function (t) {
      var v = 0;
      for (var i = 0; i < waves.length; i++) {
        v += waves[i].a * Math.sin(2 * Math.PI * waves[i].f * t + waves[i].p);
      }
      return v / total;
    };
  }

  function onArc(cx, cy, r, deg) {
    var rad = deg * Math.PI / 180;
    var nx = Math.cos(rad);
    var ny = Math.sin(rad);
    return [cx + r * nx, cy + r * ny, nx, ny];
  }

  /** Segment table for a rounded square whose four corners each have their own
   *  radius — nobody draws four matching corners freehand, and a single radius
   *  is most of what makes a generated frame look machined. */
  function outline(a, b, radii) {
    var tl = radii[0], tr = radii[1], br = radii[2], bl = radii[3];
    var quarter = function (r) { return (Math.PI / 2) * r; };
    var segments = [
      { len: (b - a) - tl - tr, at: function (u) { return [a + tl + u, a, 0, -1]; } },
      { len: quarter(tr), at: function (u) { return onArc(b - tr, a + tr, tr, 270 + (u / quarter(tr)) * 90); } },
      { len: (b - a) - tr - br, at: function (u) { return [b, a + tr + u, 1, 0]; } },
      { len: quarter(br), at: function (u) { return onArc(b - br, b - br, br, (u / quarter(br)) * 90); } },
      { len: (b - a) - br - bl, at: function (u) { return [b - br - u, b, 0, 1]; } },
      { len: quarter(bl), at: function (u) { return onArc(a + bl, b - bl, bl, 90 + (u / quarter(bl)) * 90); } },
      { len: (b - a) - bl - tl, at: function (u) { return [a, b - bl - u, -1, 0]; } },
      { len: quarter(tl), at: function (u) { return onArc(a + tl, a + tl, tl, 180 + (u / quarter(tl)) * 90); } }
    ];
    var perimeter = segments.reduce(function (sum, s) { return sum + s.len; }, 0);
    return {
      perimeter: perimeter,
      at: function (d) {
        for (var i = 0; i < segments.length; i++) {
          if (d <= segments[i].len || i === segments.length - 1) {
            return segments[i].at(Math.min(d, segments[i].len));
          }
          d -= segments[i].len;
        }
      }
    };
  }

  /** The frame line, as an SVG path string. */
  function handDrawnLoop(a, b, wobble, seed) {
    var random = mulberry32(seed);
    var noise = periodicNoise(random);
    // Four corners, four radii, none of them equal.
    var radii = [0, 0, 0, 0].map(function () { return 17 + random() * 15; });
    var shape = outline(a, b, radii);
    // A freehand square is never square to the page either.
    var tilt = (random() - 0.5) * 0.016;
    var cx = (a + b) / 2, cy = (a + b) / 2;
    var cos = Math.cos(tilt), sin = Math.sin(tilt);

    var TURNS = 1.022;          // the overshoot past the starting corner
    var STEPS = 200;
    var points = [];

    for (var i = 0; i <= STEPS; i++) {
      var t = (i / STEPS) * TURNS;
      var here = shape.at((t % 1) * shape.perimeter);
      var push = wobble * noise(t % 1);
      // Inward, so the tail crosses the start rather than running beside it.
      if (t > 1) push -= ((t - 1) / (TURNS - 1)) * 2.4;
      var x = here[0] + here[2] * push - cx;
      var y = here[1] + here[3] * push - cy;
      points.push([cx + x * cos - y * sin, cy + x * sin + y * cos]);
    }

    // Catmull-Rom through the samples, written out as cubic segments.
    var at = function (i) { return points[Math.max(0, Math.min(points.length - 1, i))]; };
    var d = 'M' + at(0)[0].toFixed(2) + ' ' + at(0)[1].toFixed(2);
    for (var j = 0; j < points.length - 1; j++) {
      var p0 = at(j - 1), p1 = at(j), p2 = at(j + 1), p3 = at(j + 2);
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(2) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(2)
         + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(2) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(2)
         + ' ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
    }
    return d;
  }

  document.getElementById('frame-path')
    .setAttribute('d', handDrawnLoop(11, 319, 4.6, 6180339));

  /** Closed spline through points that wrap, so the seam is as smooth as the
   *  rest of the loop rather than a visible kink. */
  function closedSpline(points) {
    var n = points.length;
    var at = function (i) { return points[((i % n) + n) % n]; };
    var d = 'M' + at(0)[0].toFixed(2) + ' ' + at(0)[1].toFixed(2);
    for (var i = 0; i < n; i++) {
      var p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
      d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(2) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(2)
         + ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(2) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(2)
         + ' ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2);
    }
    return d + ' Z';
  }

  /** The buttons, drawn the same way the frame is: the radius wanders as it
   *  goes round, so no two of them are the same shape and none is a circle. */
  function handDrawnDisc(cx, cy, radius, wobble, seed) {
    var noise = periodicNoise(mulberry32(seed));
    var STEPS = 108;
    var points = [];
    for (var i = 0; i < STEPS; i++) {
      var t = i / STEPS;
      var angle = t * Math.PI * 2;
      var r = radius + wobble * noise(t);
      points.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r]);
    }
    return closedSpline(points);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.disc'), function (disc) {
    var d = handDrawnDisc(44, 44, 34, 1.5, Number(disc.getAttribute('data-disc')));
    disc.setAttribute('d', d);
    // The gloss is the same shape, so the highlight is clipped to the disc.
    var gloss = disc.parentNode.querySelector('.gloss');
    if (gloss) gloss.setAttribute('d', d);
  });

  /** The glyphs are drawn by hand too — the disc around them is nearly true,
   *  so this is where the wobble has to live if it is going to be felt. Walk
   *  the polygon by length, push each sample off the edge it sits on, spline. */
  function handDrawnPolygon(vertices, wobble, seed, steps) {
    var noise = periodicNoise(mulberry32(seed));
    var edges = [];
    var perimeter = 0;
    for (var i = 0; i < vertices.length; i++) {
      var from = vertices[i];
      var to = vertices[(i + 1) % vertices.length];
      var dx = to[0] - from[0], dy = to[1] - from[1];
      var length = Math.sqrt(dx * dx + dy * dy);
      edges.push({ from: from, dx: dx / length, dy: dy / length, length: length });
      perimeter += length;
    }

    var points = [];
    for (var k = 0; k < steps; k++) {
      var t = k / steps;
      var walked = t * perimeter;
      for (var e = 0; e < edges.length; e++) {
        if (walked <= edges[e].length || e === edges.length - 1) {
          var edge = edges[e];
          var along = Math.min(walked, edge.length);
          var push = wobble * noise(t);
          points.push([
            edge.from[0] + edge.dx * along + edge.dy * push,
            edge.from[1] + edge.dy * along - edge.dx * push
          ]);
          break;
        }
        walked -= edges[e].length;
      }
    }
    return closedSpline(points);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.glyph-shape'), function (shape) {
    var vertices = shape.getAttribute('data-poly').split(' ').map(function (pair) {
      return pair.split(',').map(Number);
    });
    shape.setAttribute('d', handDrawnPolygon(vertices, 0.42, Number(shape.getAttribute('data-seed')), 84));
  });

  /** A straight line drawn freehand bows. */
  Array.prototype.forEach.call(document.querySelectorAll('.glyph-bow'), function (bow) {
    var from = bow.getAttribute('data-from').split(',').map(Number);
    var to = bow.getAttribute('data-to').split(',').map(Number);
    var amount = Number(bow.getAttribute('data-bow'));
    var dx = to[0] - from[0], dy = to[1] - from[1];
    var length = Math.sqrt(dx * dx + dy * dy);
    var cx = (from[0] + to[0]) / 2 + (dy / length) * amount;
    var cy = (from[1] + to[1]) / 2 - (dx / length) * amount;
    bow.setAttribute('d', 'M' + from[0] + ' ' + from[1]
      + ' Q' + cx.toFixed(2) + ' ' + cy.toFixed(2) + ' ' + to[0] + ' ' + to[1]);
  });

  /** One place to read a colour out of the stylesheet. */
  function token(name, fallback) {
    var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return value || fallback;
  }

  /* ── Guide lines ────────────────────────────────────────── */

  function drawGrid() {
    var scale = window.devicePixelRatio || 1;
    if (gridCanvas.width !== CANVAS_SIZE * scale) {
      gridCanvas.width = CANVAS_SIZE * scale;
      gridCanvas.height = CANVAS_SIZE * scale;
    }
    gridCanvas.style.width = CANVAS_SIZE + 'px';
    gridCanvas.style.height = CANVAS_SIZE + 'px';

    var ctx = gridCanvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
    if (grid === '無') return;

    var a = GRID_INSET;
    var b = CANVAS_SIZE - GRID_INSET;
    var mid = CANVAS_SIZE / 2;

    // Read from the stylesheet so the guides follow the theme with everything
    // else rather than keeping their own copy of the palette.
    ctx.strokeStyle = token('--grid-line', 'rgba(90, 58, 32, 0.85)');
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(mid, a); ctx.lineTo(mid, b);
    ctx.moveTo(a, mid); ctx.lineTo(b, mid);
    if (grid === '米') {
      ctx.moveTo(a, a); ctx.lineTo(b, b);
      ctx.moveTo(b, a); ctx.lineTo(a, b);
    }
    ctx.stroke();
  }

  /* ── Stroke start hint ──────────────────────────────────── */

  /** The stroke's spine, in character coordinates. getCharacterData gives a
   *  PARSED character — strokes carrying their own points — not the raw JSON,
   *  so there is no `medians` on it to read. */
  function strokeSpine(strokeNum) {
    if (!charData || !charData.strokes) return null;
    var stroke = charData.strokes[strokeNum];
    return (stroke && stroke.points && stroke.points.length >= 2) ? stroke.points : null;
  }

  /** Character coordinates are not the 0..1024 box they look like: the glyph
   *  runs from y = -124 upward and y grows the other way, and the writer
   *  centres it inside the padding. Its own positioner holds the numbers that
   *  resolve all of that, so they are read rather than guessed at. */
  function charToCanvas(point) {
    var p = writer && writer._positioner;
    if (!p) return null;
    return {
      x: point.x * p.scale + p.xOffset,
      y: p.height - p.yOffset - point.y * p.scale
    };
  }

  function showHint(strokeNum) {
    var spine = strokeSpine(strokeNum);
    var start = spine && charToCanvas(spine[0]);
    if (!start) { hideHint(); return; }

    // Aim at the first point that is actually somewhere else — the spine
    // often starts with a couple of samples nearly on top of each other, and
    // those give a direction that is pure noise.
    var aim = null;
    for (var i = 1; i < spine.length; i++) {
      var candidate = charToCanvas(spine[i]);
      var dx = candidate.x - start.x;
      var dy = candidate.y - start.y;
      if (dx * dx + dy * dy >= HINT_AIM_DISTANCE * HINT_AIM_DISTANCE) { aim = candidate; break; }
      aim = candidate;
    }
    if (!aim) { hideHint(); return; }

    var angle = Math.atan2(aim.y - start.y, aim.x - start.x) * 180 / Math.PI;
    hintGroup.setAttribute('transform',
      'translate(' + start.x.toFixed(1) + ',' + start.y.toFixed(1) + ')');
    hintArrow.setAttribute('transform', 'rotate(' + angle.toFixed(1) + ')');
    hintGroup.removeAttribute('display');
  }

  function hideHint() {
    hintGroup.setAttribute('display', 'none');
  }

  /* ── Canvas ─────────────────────────────────────────────── */

  /** hanzi-writer sizes the canvas in CSS pixels, so the proxy inflates the
   *  backing store by DPR and pre-scales the context to keep strokes crisp. */
  function createRetinaCanvasProxy(target, scale) {
    return new Proxy(target, {
      set: function (obj, prop, value) {
        if (prop === 'width' || prop === 'height') {
          obj[prop] = value * scale;
          var ctx = obj.getContext('2d');
          if (ctx) {
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(scale, scale);
          }
          return true;
        }
        obj[prop] = value;
        return true;
      },
      get: function (obj, prop) {
        if (prop === 'width' || prop === 'height') return obj[prop] / scale;
        var val = obj[prop];
        return typeof val === 'function' ? val.bind(obj) : val;
      }
    });
  }

  function build() {
    run += 1;
    quizActive = false;
    strokeCount = 0;
    charData = null;
    hideHint();
    loadError.classList.remove('shown');

    if (writer) {
      try {
        writer.cancelQuiz();
        if (writer._renderState && writer._renderState.cancelAll) writer._renderState.cancelAll();
      } catch (e) { /* the writer is being discarded anyway */ }
    }

    var ctx = canvas.getContext('2d');
    if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);

    var scale = window.devicePixelRatio || 1;
    canvas.style.width = CANVAS_SIZE + 'px';
    canvas.style.height = CANVAS_SIZE + 'px';

    // hanzi-writer takes its colours at construction, so they are read from
    // the stylesheet here — the same --ink the selected buttons are marked in.
    var ink = token('--ink', '#fcd34d');
    var inkOutline = token('--ink-outline', '#5a3a20');

    writer = HanziWriter.create(createRetinaCanvasProxy(canvas, scale), char, {
      width: CANVAS_SIZE,
      height: CANVAS_SIZE,
      padding: 15,
      renderer: 'canvas',
      strokeAnimationSpeed: 1.5,
      delayBetweenStrokes: DELAY_BETWEEN_STROKES,
      showOutline: true,
      strokeColor: ink,
      radicalColor: ink,
      outlineColor: inkOutline,
      drawingColor: ink,
      drawingWidth: 15,
      leniency: LENIENCY,
      acceptBackwardsStrokes: false,
      onLoadCharDataError: function () {
        missingChar.textContent = char;
        loadError.classList.add('shown');
      }
    });

    // Picking a character is the whole gesture: the sheet shows it once, then
    // hands itself over. Chained off getCharacterData rather than off the
    // load callback — that one fires while the writer is still assembling,
    // before it has anything to animate with, and drops the request.
    var forBuild = run;
    writer.getCharacterData().then(function (data) {
      if (forBuild !== run) return;
      charData = data;
      strokeCount = (data && data.strokes) ? data.strokes.length : 0;
      animate();
    }).catch(function () { /* onLoadCharDataError has the message */ });
  }

  /** Plays the strokes one at a time so each one can be sounded as it starts —
   *  animateCharacter runs the whole glyph in a single call with no per-stroke
   *  hook. hideCharacter first, exactly as animateCharacter does internally,
   *  which is what clears the previous strokes. */
  function animate() {
    if (!writer) return;
    writer.cancelQuiz();
    quizActive = false;
    hideHint();
    run += 1;
    var thisRun = run;
    if (!strokeCount) return;

    writer.hideCharacter({ duration: 0 });

    var i = 0;
    (function step() {
      if (thisRun !== run) return;
      if (i >= strokeCount) {
        // The demonstration is over, so it is the writer's turn — this is the
        // only way writing starts, since there is no button for it.
        window.setTimeout(function () { if (thisRun === run) practice(); }, PAUSE_BEFORE_WRITING);
        return;
      }
      play('sfx-brush');
      writer.animateStroke(i, {
        onComplete: function () {
          if (thisRun !== run) return;
          i += 1;
          window.setTimeout(step, DELAY_BETWEEN_STROKES);
        }
      });
    })();
  }

  function practice() {
    if (!writer) return;
    run += 1;
    quizActive = true;
    showHint(0);
    writer.quiz({
      // The stroke number rather than a running count, so a mistake never
      // advances the scale and a resumed quiz picks the note back up.
      onCorrectStroke: function (data) {
        play('sfx-correct', noteRate(data ? data.strokeNum : 0));
        if (data && data.strokesRemaining > 0) {
          showHint(data.strokeNum + 1);
        } else {
          hideHint();
        }
      },
      onMistake: function (data) {
        play('sfx-wrong');
        if (data) showHint(data.strokeNum);
      },
      onComplete: function () {
        quizActive = false;
        hideHint();
        play('sfx-correct-word');
      }
    });
  }

  /* ── Theme ──────────────────────────────────────────────── */

  function applyTheme(next) {
    theme = next;
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* file:// or private mode */ }
    drawGrid();
    if (writer) build();
  }

  function initialTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* unavailable */ }
    if (THEMES.indexOf(saved) !== -1) return saved;
    var query = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
    return (query && query.matches) ? 'light' : 'dark';
  }

  /* ── Wiring ─────────────────────────────────────────────── */

  /** Returns a refresh function, for when something other than a click on this
   *  row changes what is selected — the theme restored on load, for instance. */
  function buildRow(container, values, isSelected, onPick, fill) {
    function refresh() {
      buttons.forEach(function (button, i) {
        button.setAttribute('aria-pressed', String(isSelected(values[i])));
      });
    }
    var buttons = values.map(function (value) {
      var button = document.createElement('button');
      button.className = 'glyph';
      if (fill) fill(button, value); else button.textContent = value;
      button.addEventListener('click', function () {
        onPick(value);
        refresh();
      });
      container.appendChild(button);
      return button;
    });
    refresh();
    return refresh;
  }

  /** A miniature of the sheet each option draws — an empty square for 無. */
  function gridPreview(value) {
    var lines = '';
    if (value !== '無') {
      lines += '<line x1="10" y1="2" x2="10" y2="18" /><line x1="2" y1="10" x2="18" y2="10" />';
    }
    if (value === '米') {
      lines += '<line x1="2.5" y1="2.5" x2="17.5" y2="17.5" /><line x1="17.5" y1="2.5" x2="2.5" y2="17.5" />';
    }
    return '<svg viewBox="0 0 20 20" aria-hidden="true">'
         + '<rect x="1" y="1" width="18" height="18" rx="2" />'
         + '<g stroke-dasharray="2 2">' + lines + '</g>'
         + '</svg>';
  }

  function themeIcon(value) {
    var shape = value === 'light'
      ? '<circle cx="12" cy="12" r="4.2" />'
        + '<path d="M12 2.6v2.2M12 19.2v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6'
        + 'M2.6 12h2.2M19.2 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6" />'
      : '<path d="M20.5 13.3A8.6 8.6 0 1110.7 3.5a6.7 6.7 0 009.8 9.8z" />';
    return '<svg viewBox="0 0 24 24" aria-hidden="true">' + shape + '</svg>';
  }

  buildRow(
    characterList,
    CHARACTERS,
    function (value) { return value === char; },
    function (value) { char = value; build(); }
  );

  buildRow(
    gridList,
    GRIDS,
    function (value) { return value === grid; },
    function (value) { grid = value; drawGrid(); },
    function (button, value) {
      button.innerHTML = gridPreview(value) + '<span>' + value + '</span>';
      button.setAttribute('title', '格線：' + value);
    }
  );

  var refreshThemes = buildRow(
    themeList,
    THEMES,
    function (value) { return value === theme; },
    applyTheme,
    function (button, value) {
      button.innerHTML = themeIcon(value)
        + '<span>' + (value === 'light' ? '淺色' : '深色') + '</span>';
      button.setAttribute('title', value === 'light' ? 'Light' : 'Dark');
    }
  );

  // hanzi-writer handles the drawing itself; this listener rides alongside it
  // purely to sound the pen touching down.
  canvas.addEventListener('pointerdown', function () {
    if (quizActive) {
      play('sfx-brush');
      hideHint();
    }
  });

  document.getElementById('animate').addEventListener('click', animate);

  applyTheme(initialTheme());
  refreshThemes();

  if (typeof HanziWriter === 'undefined') {
    missingChar.textContent = '—';
    loadError.querySelector('p').textContent =
      'Could not load hanzi-writer from the CDN. This page needs an internet connection.';
    loadError.classList.add('shown');
    return;
  }

  build();
})();
</script>

</body>
</html>
